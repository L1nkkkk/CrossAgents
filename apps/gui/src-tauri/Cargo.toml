[package]
name = "crossagents-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "CrossAgents desktop GUI: a client of the hub's local API"

# Not part of the root workspace: `cargo test --workspace` stays free of Tauri.
[workspace]

[lib]
name = "crossagents_gui_lib"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["time", "sync"] }

[profile.release]
strip = true
