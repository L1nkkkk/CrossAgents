# OpenAI Codex, the built-in agent (docs/DESIGN.md §9.3).
#
# `driver = "codex-native"` is `codex app-server` (JSON-RPC over stdio); `acp-generic` goes
# through the codex-acp adapter (`command` below, needs Node.js).

name = "codex"
driver = "codex-native"
command = ["npx", "-y", "@agentclientprotocol/codex-acp"]
# Older than this, `codex app-server` does not have the methods the driver calls: the agent
# is not registered and the GUI says the version is too low (docs/research/multica.md §2.9).
min_version = "0.100.0"
# The upstream series the driver was checked against (docs/DESIGN.md §9.4): the protocol in
# `crates/drivers/src/codex_native/wire.rs` on 0.158.0, `turn/steer` on 0.166.0-alpha.5.1.
# Outside them the CLI still runs, marked unverified.
verified = ["0.158", "0.166"]

[models]
# No list of its own: Codex reads the models it offers from its own `models_cache.json`.
efforts = ["low", "medium", "high"]

[locate]
commands = ["codex"]
# npm installs `codex` as a Node wrapper; the vendor binary behind it is started directly
# (killing the wrapper would leave the child running).
shim = "codex-vendor"
version = ["--version"]

# The Codex desktop app keeps its own copy; used when `PATH` has no `codex`.
[locate.bundled]
windows = ["%LOCALAPPDATA%/OpenAI/Codex/bin/*/codex.exe"]
macos = ["/Applications/Codex.app/Contents/Resources/codex"]

[install]
label = "Codex"
# https://github.com/openai/codex (install: `npm install -g @openai/codex`)
docs = "https://github.com/openai/codex"
# Kept as the fallback for a machine without npm: the same command, still copyable.
hint = "npm install -g @openai/codex"

[[install.methods]]
id = "npm"
requires = ["npm"]
run = ["npm", "install", "-g", "@openai/codex"]
upgrade = ["npm", "install", "-g", "@openai/codex@latest"]
