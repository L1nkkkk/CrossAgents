# Claude Code, the built-in agent (docs/DESIGN.md §9.3).
#
# `driver = "claude-native"` is its stream-json protocol (the one the Agent SDK speaks);
# `acp-generic` goes through Anthropic's ACP adapter (`command` below, needs Node.js).
# Everything outside the protocol is here: where the CLI is, how it is installed, its models
# and effort levels.

name = "claude"
driver = "claude-native"
model_env = "ANTHROPIC_MODEL"
command = ["npx", "-y", "@agentclientprotocol/claude-agent-acp"]
# Older than this, the stream-json control protocol does not exist in the shape the driver
# speaks: the agent is not registered and the GUI says the version is too low
# (docs/research/multica.md §2.9).
min_version = "2.0.0"
# The upstream series the driver was checked against (docs/DESIGN.md §9.4); a CLI outside
# them still runs, marked unverified. Bump after the smoke tests
# (crates/drivers/tests/claude_smoke.rs) pass on a new one.
verified = ["2.1"]

[models]
# `claude --model` takes these names.
fallback = ["opus", "sonnet", "haiku"]
efforts = ["low", "medium", "high", "xhigh", "max"]

[locate]
# `native_command` in `config.toml` wins over all of this.
commands = ["claude"]
# The native installer puts it beside the user's own programs: `~/.local/bin/claude`,
# which is `%USERPROFILE%\.local\bin\claude.exe` on Windows.
# https://support.claude.com/en/articles/14554922 (1.2: the binary's location per system)
# The Claude desktop app keeps a copy per build; the newest one is used.
bundled = ["%LOCALAPPDATA%/Claude-Data/*/claude-code/*/*/claude.exe"]
version = ["--version"]

[locate.paths]
windows = ["~/.local/bin/claude"]
linux = ["~/.local/bin/claude"]
macos = ["~/.local/bin/claude", "/opt/homebrew/bin/claude", "/usr/local/bin/claude"]

[install]
label = "Claude Code"
# The native installer is the way in; npm is deprecated.
# https://docs.claude.com/en/docs/claude-code/setup
docs = "https://docs.claude.com/en/docs/claude-code/setup"

[[install.methods]]
id = "native"
os = ["windows"]
# https://docs.claude.com/en/docs/claude-code/setup (Windows: `irm https://claude.ai/install.ps1 | iex`)
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "irm https://claude.ai/install.ps1 | iex"]
upgrade = ["claude", "update"]

[[install.methods]]
id = "native"
os = ["macos", "linux"]
# https://docs.claude.com/en/docs/claude-code/setup (macOS and Linux: `curl -fsSL https://claude.ai/install.sh | bash`)
run = ["bash", "-c", "curl -fsSL https://claude.ai/install.sh | bash"]
upgrade = ["claude", "update"]
