# Cursor CLI: one process per turn, with conversations persisted by chat id.
name = "cursor"
driver = "cursor-native"
command = ["agent", "acp"]

[models]
# CLI model aliases; availability depends on the signed-in account.
fallback = ["auto", "sonnet-4-thinking", "gpt-5"]
efforts = []

[locate]
commands = ["agent", "cursor-agent"]
version = ["--version"]

[locate.paths]
windows = ["~/.local/bin/agent", "~/.local/bin/cursor-agent"]
linux = ["~/.local/bin/agent", "~/.local/bin/cursor-agent"]
# https://docs.brew.sh/FAQ#why-should-i-install-homebrew-in-the-default-location
macos = ["~/.local/bin/agent", "~/.local/bin/cursor-agent", "/opt/homebrew/bin/agent", "/usr/local/bin/agent", "/opt/homebrew/bin/cursor-agent", "/usr/local/bin/cursor-agent"]

[install]
label = "Cursor CLI"
hint = "irm 'https://cursor.com/install?win32=true' | iex"
docs = "https://cursor.com/docs/cli/installation"

[[install.methods]]
id = "native"
os = ["windows"]
run = ["powershell", "-NoProfile", "-Command", "irm 'https://cursor.com/install?win32=true' | iex"]
