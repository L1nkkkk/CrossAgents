[package]
name = "crossagents-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Derive ts-rs bindings for types that cross the local API.
ts = ["dep:ts-rs"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "process"] }
tracing.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# `Win32_Storage_FileSystem` and `Win32_System_IO` are for `tests/lock_kill_race.rs` only
# (docs/tasks/LOCKS.md §5: `LockFileEx` on a lock file).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Only for `tests/lock_kill_race.rs`: the experiment needs a second process that can be
# killed from the outside while it holds the lock (docs/tasks/LOCKS.md §5).
[[bin]]
name = "lock_kill_helper"
path = "tests/support/lock_kill_helper.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
