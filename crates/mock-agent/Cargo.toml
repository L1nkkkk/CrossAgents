[lints]
workspace = true

[dev-dependencies]
chrono.workspace = true
crossagents-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
crossagents-api-types.workspace = true
crossagents-hub.workspace = true
assert_cmd.workspace = true
futures.workspace = true
reqwest.workspace = true
tempfile.workspace = true
crossagents-plugins.workspace = true
