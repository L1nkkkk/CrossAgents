# What this project declares for CrossAgents runs on it (docs/tasks/DOGFOOD.md §9).
[run]
# Run by the hub in the run's checkout before the lead lands or finishes a run that changed
# something; all must pass. A check with `paths` runs only when the run changed one of them,
# so a run that only touches the GUI or the docs does not wait for cargo. The GUI's checks
# need `npm install` first, so they are not here.
checks = [
    { command = "cargo test --workspace", paths = ["crates", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo", "crossagents.toml"] },
]
# A first build of the workspace takes a while; later runs reuse the repository's shared one.
timeout_secs = 1800
