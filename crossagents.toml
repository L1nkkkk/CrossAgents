# What this project declares for CrossAgents runs on it (docs/tasks/DOGFOOD.md §9).
[run]
# Run by the hub in the run's checkout before the lead lands or finishes a run that changed
# something; all must pass. The GUI's checks need `npm install` first, so they are not here.
checks = ["cargo test --workspace"]
# A first build of the workspace in a fresh run takes a while.
timeout_secs = 1800
