# What this project declares for CrossAgents runs on it (docs/tasks/DOGFOOD.md §9).
[run]
# Run in every fresh worktree right after the hub creates it and before an agent gets it:
# each worktree installs its own dependencies, nothing is shared between them
# (docs/tasks/TOOLCHAIN.md §7). `dir` is relative to the checkout; `paths` is what the
# worktree has to have for the command to be worth running. A failure is not swallowed: the
# agent that gets the worktree is told, and it is written on the task.
setup = [
    { command = "npm ci", dir = "apps/gui", paths = ["apps/gui/package.json"] },
]
# Run by the hub in the run's checkout before the lead lands or finishes a run that changed
# something; all must pass. A check with `paths` runs only when the run changed one of them,
# so a run that only touches the GUI or the docs does not wait for cargo. Checks run in order
# and stop at the first failure: the GUI's `npm ci` puts a fresh worktree's dependencies in
# `apps/gui/node_modules` before its typecheck and tests, whatever the setup above did, so the
# checks compare against the lock file either way.
checks = [
    { command = "cargo test --workspace", paths = ["crates", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo", "crossagents.toml"] },
    { command = "npm --prefix apps/gui ci", paths = ["apps/gui", "crossagents.toml"] },
    { command = "npm --prefix apps/gui run typecheck", paths = ["apps/gui", "crossagents.toml"] },
    { command = "npm --prefix apps/gui test", paths = ["apps/gui", "crossagents.toml"] },
]
# A first build of the workspace takes a while; later runs reuse the repository's shared one.
timeout_secs = 1800
