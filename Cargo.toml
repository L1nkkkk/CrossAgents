[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
crossagents-core = { path = "crates/core" }
crossagents-api-types = { path = "crates/api-types" }
crossagents-store-sqlite = { path = "crates/store-sqlite" }
crossagents-hub = { path = "crates/hub" }
crossagents-drivers = { path = "crates/drivers" }
crossagents-plugins = { path = "crates/plugins" }
crossagents-orchestrator = { path = "crates/orchestrator" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
dunce = "1.0.5"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
base64 = "0.23.1"
sha2 = "0.10.9"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

assert_cmd = "2.2.2"
tempfile = "3.27.0"

[workspace.lints.rust]
# `deny`, not `forbid`: the one Windows FFI call in cli opts out locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# rustc 1.99 on Windows crashes (STATUS_ACCESS_VIOLATION) on incremental builds of
# crossagents-core; full rebuilds of our crates are fast enough.
incremental = false
